<!DOCTYPE html>
<html>
<head>
    <title>InsureEasy</title>
</head>
<body>

<h1 align="center">InsureEasy Insurance Management</h1>

<h2>User Login</h2>
<form>
    Email: <input type="email"><br><br>
    Password: <input type="password"><br><br>
    <input type="submit" value="Login">
</form>

<hr>

<h2>Insurance Plans</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Insurance</th>
    <th>Coverage</th>
    <th>Premium</th>
</tr>
<tr>
    <td>Health Insurance</td>
    <td>₹5 Lakhs</td>
    <td>₹10000</td>
</tr>
<tr>
    <td>Car Insurance</td>
    <td>₹3 Lakhs</td>
    <td>₹7000</td>
</tr>
<tr>
    <td>Home Insurance</td>
    <td>₹10 Lakhs</td>
    <td>₹12000</td>
</tr>
</table>

<h2>Customer Details</h2>
<form>
    Name: <input type="text"><br><br>
    Phone: <input type="text"><br><br>
    Policy Type:
    <select>
        <option>Health</option>
        <option>Car</option>
        <option>Home</option>
    </select><br><br>

    <input type="submit" value="Apply Policy">
</form>

<h2>Payment</h2>
<form>
    Policy Number: <input type="text"><br><br>
    Amount: <input type="number"><br><br>
    <input type="submit" value="Pay Premium">
</form>

</body>
</html>
