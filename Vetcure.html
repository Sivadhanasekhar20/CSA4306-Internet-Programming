<!DOCTYPE html>
<html>
<head>
    <title>VetCure</title>
</head>
<body>

<h1 align="center">VetCure - Animal Healthcare</h1>

<h2>Farmer Registration</h2>

<form>
    Name: <input type="text"><br><br>
    Email: <input type="email"><br><br>
    Password: <input type="password"><br><br>
    Phone: <input type="text"><br><br>

    <input type="submit" value="Register">
</form>

<h2>Login</h2>

<form>
    Email: <input type="email"><br><br>
    Password: <input type="password"><br><br>
    <input type="submit" value="Login">
</form>

<hr>

<h2>Animal Complaint</h2>

<form>
    Animal Name:
    <input type="text"><br><br>

    Symptoms:<br>
    <textarea rows="5" cols="40"></textarea><br><br>

    Upload Image:
    <input type="file"><br><br>

    <input type="submit" value="Send to Doctor">
</form>

<h2>Doctor</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Doctor</th>
    <th>Specialization</th>
    <th>Contact</th>
</tr>
<tr>
    <td>Dr. Kumar</td>
    <td>Animal Doctor</td>
    <td>9876543210</td>
</tr>
</table>

<h2>Doctor Solution</h2>

<textarea rows="5" cols="40"></textarea><br><br>
<input type="submit" value="Submit Solution">

<h2>Payment</h2>

<form>
    Amount:
    <input type="number"><br><br>
    <input type="submit" value="Make Payment">
</form>

</body>
</html>
