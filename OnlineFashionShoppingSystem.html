<!DOCTYPE html>
<html>
<head>
    <title>StyleHub Fashion Store</title>
</head>
<body>

<h1 align="center">StyleHub Fashion Store</h1>

<h2>Login</h2>
<form>
    Email: <input type="email"><br><br>
    Password: <input type="password"><br><br>
    <input type="submit" value="Login">
</form>

<hr>

<h2>Categories</h2>

<ul>
    <li>Men</li>
    <li>Women</li>
    <li>Children</li>
    <li>Footwear</li>
    <li>Accessories</li>
</ul>

<h2>Products</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Product</th>
    <th>Category</th>
    <th>Price</th>
</tr>
<tr>
    <td>Shirt</td>
    <td>Men</td>
    <td>₹999</td>
</tr>
<tr>
    <td>Dress</td>
    <td>Women</td>
    <td>₹1499</td>
</tr>
<tr>
    <td>Shoes</td>
    <td>Footwear</td>
    <td>₹1999</td>
</tr>
</table>

<h2>Add to Cart</h2>
<form>
    Product:
    <input type="text"><br><br>

    Size:
    <select>
        <option>S</option>
        <option>M</option>
        <option>L</option>
        <option>XL</option>
    </select><br><br>

    Quantity:
    <input type="number"><br><br>

    <input type="submit" value="Add to Cart">
</form>

<h2>Customer Review</h2>
<textarea rows="4" cols="40"></textarea><br><br>
<input type="submit" value="Submit Review">

</body>
</html>
