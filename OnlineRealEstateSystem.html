<!DOCTYPE html>
<html>
<head>
    <title>Home Finder</title>
</head>
<body>

<h1 align="center">Home Finder - Real Estate</h1>

<h2>Login</h2>
<form>
    Username: <input type="text"><br><br>
    Password: <input type="password"><br><br>
    <input type="submit" value="Login">
</form>

<hr>

<h2>Search Property</h2>

<form>
    Location:
    <input type="text"><br><br>

    Property Type:
    <select>
        <option>House</option>
        <option>Apartment</option>
        <option>Land</option>
        <option>Commercial</option>
    </select><br><br>

    Maximum Price:
    <input type="number"><br><br>

    <input type="submit" value="Search">
</form>

<h2>Available Properties</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Property</th>
    <th>Location</th>
    <th>Price</th>
</tr>
<tr>
    <td>2 BHK House</td>
    <td>Chennai</td>
    <td>₹50 Lakhs</td>
</tr>
<tr>
    <td>Apartment</td>
    <td>Tirupati</td>
    <td>₹35 Lakhs</td>
</tr>
<tr>
    <td>Land</td>
    <td>Bangalore</td>
    <td>₹40 Lakhs</td>
</tr>
</table>

<h2>Contact Agent</h2>
<form>
    Name: <input type="text"><br><br>
    Message:<br>
    <textarea rows="4" cols="40"></textarea><br><br>
    <input type="submit" value="Contact">
</form>

</body>
</html>
