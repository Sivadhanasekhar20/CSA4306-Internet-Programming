<!DOCTYPE html>
<html>
<head>
    <title>VoteOnline</title>
</head>
<body>

<h1 align="center">VoteOnline - E-Voting System</h1>

<h2>Voter Login</h2>

<form>
    Voter ID:
    <input type="text"><br><br>

    Password:
    <input type="password"><br><br>

    <input type="submit" value="Login">
</form>

<h2>OTP Verification</h2>

<form>
    Enter OTP:
    <input type="text"><br><br>

    <input type="submit" value="Verify OTP">
</form>

<hr>

<h2>Election Candidates</h2>

<form>
    <input type="radio" name="candidate">
    Candidate A<br><br>

    <input type="radio" name="candidate">
    Candidate B<br><br>

    <input type="radio" name="candidate">
    Candidate C<br><br>

    <input type="submit" value="Submit Vote">
</form>

<h2>Election Result</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Candidate</th>
    <th>Votes</th>
</tr>
<tr>
    <td>Candidate A</td>
    <td>120</td>
</tr>
<tr>
    <td>Candidate B</td>
    <td>100</td>
</tr>
<tr>
    <td>Candidate C</td>
    <td>80</td>
</tr>
</table>

</body>
</html>
