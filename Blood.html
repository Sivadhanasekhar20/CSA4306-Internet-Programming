<!DOCTYPE html>
<html>
<head>
    <title>Blood Management System</title>
</head>
<body>

<h1 align="center">Blood Management System</h1>

<h2>Donor Registration</h2>

<form>
    Name: <input type="text"><br><br>
    Email: <input type="email"><br><br>
    Phone: <input type="text"><br><br>

    Blood Group:
    <select>
        <option>A+</option>
        <option>A-</option>
        <option>B+</option>
        <option>B-</option>
        <option>O+</option>
        <option>O-</option>
        <option>AB+</option>
        <option>AB-</option>
    </select><br><br>

    <input type="submit" value="Register">
</form>

<hr>

<h2>Search Donor</h2>

<form>
    Blood Group:
    <select>
        <option>A+</option>
        <option>B+</option>
        <option>O+</option>
        <option>AB+</option>
    </select><br><br>

    Location:
    <input type="text"><br><br>

    <input type="submit" value="Search">
</form>
