<!DOCTYPE html>
<html>
<head>
    <title>Flight Reservation</title>
</head>
<body>

<h2>Flight Reservation System</h2>

<input type="text" id="name" placeholder="Passenger Name"><br><br>

<input type="text" id="from" placeholder="From"><br><br>

<input type="text" id="to" placeholder="Destination"><br><br>

<input type="date" id="date"><br><br>

<select id="class">
    <option>Economy</option>
    <option>Business</option>
</select><br><br>

<button onclick="book()">Book Flight</button>

<h3 id="result"></h3>

<script>
function book() {

    let ticket = Math.floor(Math.random() * 900000 + 100000);

    document.getElementById("result").innerHTML =
        "Flight Booked Successfully!<br>" +
        "Ticket No: " + ticket + "<br>" +
        "Status: Confirmed";
}
</script>

</body>
</html>
